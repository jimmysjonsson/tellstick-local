# Staged configuration: not installed or enabled.
# Bind only Argus's LAN address; leave systemd-resolved's loopback sockets alone.
listen-address=192.168.1.149
bind-interfaces
port=53

# DNS only: no DHCP ranges, router advertisements, or TFTP.
no-hosts
no-resolv
# Explicit upstreams avoid a router -> Argus -> router forwarding loop.
# These handle ordinary non-TellStick DNS; replace with preferred resolvers.
server=1.1.1.1
server=1.0.0.1

# Exact host records; do not redirect the entire telldus.com zone.
host-record=api.telldus.com,192.168.1.149
host-record=local.telldus.com,192.168.1.149
local=/api.telldus.com/
local=/local.telldus.com/
local-ttl=30
cache-size=500
# No query logging.
