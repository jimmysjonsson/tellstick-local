# Phone-only trial: clients must explicitly select this DNS server.
# This file is independent of /etc/dnsmasq.conf and deploy/dnsmasq-tellstick.conf.
listen-address=192.168.1.149
bind-dynamic
port=53
no-hosts
no-resolv
pid-file=
host-record=tellstick,tellstick.lan,192.168.1.149
host-record=argus,argus.lan,192.168.1.149
local=/tellstick/
local=/tellstick.lan/
# Preserve existing router-local lookups during this trial. The router must
# retain its independent upstream DNS; do not point its upstream back here.
server=/lan/192.168.1.1
server=1.1.1.1
server=1.0.0.1
local-ttl=30
cache-size=500
# No DHCP ranges, router advertisements, TFTP, or query logging are enabled.
